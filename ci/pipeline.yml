- name: integration-tests
  <<: *gh-status-handlers
  plan:
  - get: ghost-cloudflare-r2
    # trigger: true
  - put: gh-status
    inputs: [ghost-cloudflare-r2]
    params: {state: pending}
  # - get: minio-image
  #   params: {format: oci}
  # - get: ghost-image
  #   params: {format: oci}
  # - get: hurl-image
  #   params: {format: oci}
  - get: podman-compose-image
    passed: [build-podman-compose-image]
    trigger: true
  - task: get-worker-arch # TODO: is there a better way?
    image: podman-compose-image
    config:
      platform: linux
      outputs:
        - name: arch
      run:
        path: sh
        args:
          - -cx
          - |
            uname -m > arch/arch

  - load_var: arch
    file: arch/arch

  - get: hurl-gh-release
    params:
      version: { tag: 'v6.0.0' } # TODO: make var?
      globs: ["hurl-*-*-unknown-linux-gnu.tar.gz"]

  # - task: extract-hurl # TODO: is there a better way?
