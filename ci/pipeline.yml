  #       path: sh
  #       args:
  #         - -cx
  #         - |
  #           tar -xvzf hurl-gh-release/hurl-*-((.:arch))-unknown-linux-gnu.tar.gz -C hurl-gh-release-extracted

  - task: integration-tests-task
    image: podman-compose-image
    privileged: true
    file: ghost-cloudflare-r2/ci/tasks/integration-tests.yml

