---
meta:
  gh-status-handlers: &gh-status-handlers
    on_success:
      put: gh-status
      inputs: [ghost-cloudflare-r2]
      params: {state: success}
    on_failure:
      put: gh-status
      inputs: [ghost-cloudflare-r2]
      params: {state: failure}
    on_error:
      put: gh-status
      inputs: [ghost-cloudflare-r2]
      params: {state: error}
    on_abort:
      put: gh-status
      inputs: [ghost-cloudflare-r2]
      params: {state: abort}

resource_types:
- name: cogito
  type: registry-image
  source:
    repository: 192.168.88.20:5000/cogito
    tag: 2024-12-20-arm64
    insecure: true

resources:
- name: gh-status
  type: cogito
  check_every: never
  source:
    owner: egeldenhuys
    repo: ghost-cloudflare-r2
    access_token: ((gh-status-access-token))

- name: ghost-cloudflare-r2
  type: git
  icon: github
  source:
    uri: https://github.com/egeldenhuys/ghost-cloudflare-r2.git
    branch: concourse-ci
