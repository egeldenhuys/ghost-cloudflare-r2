- name: podman-compose-image
  type: registry-image
  source:
    repository: 192.168.88.20:5000/podman-compose
    tag: latest

- name: hurl-gh-release
  type: github-release
  source:
    owner: Orange-OpenSource
    repository: hurl

# localhost:5000/oci-build-task:master-arm64

# - name: node-image
#   type: registry-image
#   source:
#     repository: node
#     tag: 20

jobs:
- name: npm-install-and-test
  <<: *gh-status-handlers
  plan:
    - get: ghost-cloudflare-r2
      trigger: true
    - put: gh-status
      inputs: [ghost-cloudflare-r2]
      params: {state: pending}
    - task: npm-install
      config:
        inputs:
          - name: ghost-cloudflare-r2
        platform: linux
        image_resource:
          type: registry-image
          source:
            repository: node
            tag: 20
        run:
          dir: ghost-cloudflare-r2
          path: sh
          args:
            - -cx
            - |
              npm install --include-dev
              npm run test

- name: build-podman-compose-image
  <<: *gh-status-handlers
  plan:
    - get: ghost-cloudflare-r2
      trigger: true
    - put: gh-status
      inputs: [ghost-cloudflare-r2]
      params: {state: pending}
    # - get: podman-base-image
    #   params: {format: oci}

    - task: build-image
      privileged: true
      file: ghost-cloudflare-r2/ci/tasks/build-podman-compose-image.yml

    - put: podman-compose-image
      params:
        image: image/image.tar

